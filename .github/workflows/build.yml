name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VBattery.sln

      - name: Build (Release)
        run: dotnet build VBattery.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/VBattery.Tests/VBattery.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: ./scripts/publish.ps1 -Version "0.1.0"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.0" installer\V-Battery.iss

      - uses: actions/upload-artifact@v4
        with:
          name: V-Battery
          path: |
            artifacts/publish/V-Battery.exe
            artifacts/installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test.trx'
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/V-Battery.exe
            artifacts/installer/*.exe
